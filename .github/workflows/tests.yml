name: Local Desk validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node --test vscode/client.test.js
      - run: npm ci --prefix tests/ui
      - run: npm test --prefix tests/ui
      - run: python tools/package_source.py --verify-only
      - run: python tools/package_source.py --output local-desk-ci.zip
  desktop-dependencies:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-desktop.lock.txt
      - run: python -m pip check
      - run: python -c "import webview, rapidocr, sounddevice, faster_whisper, pypdf, av; assert av.__version__ == '16.1.0'"
      - run: python -m unittest discover -s tests -v
